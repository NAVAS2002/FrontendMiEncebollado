# Un solo origen para todo: la app (SPA) y el backend detrás de él.
# Los teléfonos abren http://<IP-del-servidor>/ y nada más.

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Fotos de producto y comprobantes de transferencia (el backend las
    # limita a 8 MB; aquí un margen para el encabezado multipart).
    client_max_body_size 12m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    # DNS interno de Docker. Con la dirección en una variable, nginx la
    # resuelve en cada petición: si el backend se recrea (actualización,
    # reinicio) y cambia de IP interna, sigue funcionando sin reiniciar nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8000;

    location /api/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # WebSocket de tiempo real (cocina, mesas, cuentas). El backend manda un
    # latido cada 25 s; el timeout largo evita que nginx corte la conexión.
    location /ws {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /health {
        proxy_pass $backend;
        proxy_set_header Host $http_host;
    }

    # Documentación interactiva de la API (útil para soporte).
    location = /docs {
        proxy_pass $backend;
        proxy_set_header Host $http_host;
    }
    location = /openapi.json {
        proxy_pass $backend;
        proxy_set_header Host $http_host;
    }

    # Instalación en los celulares: /instalar es una guía y /certificado.crt la
    # autoridad que firma el HTTPS del servidor (la exporta ACTIVAR-HTTPS.bat a
    # la carpeta docker/certs). Van por HTTP a propósito: hay que poder
    # descargar el certificado ANTES de que el celular confíe en el HTTPS.
    location = /instalar {
        rewrite ^ /instalar.html last;
    }
    location = /instalar.html {
        add_header Cache-Control "no-cache";
    }
    # Con tipo "certificado" (lo que necesita Safari/iPhone para ofrecer el perfil).
    location = /certificado.crt {
        alias /usr/share/nginx/certs/certificado-MiEncebollado.crt;
        default_type application/x-x509-ca-cert;
        add_header Content-Disposition 'attachment; filename="certificado-MiEncebollado.crt"';
        add_header Cache-Control "no-cache";
    }
    # Como archivo cualquiera: en Android se elige luego en Ajustes como "Certificado de CA".
    location = /certificado-manual.crt {
        alias /usr/share/nginx/certs/certificado-MiEncebollado.crt;
        # Sin la tabla de tipos, nginx lo reconocería como certificado por la extensión.
        types { }
        default_type application/octet-stream;
        add_header Content-Disposition 'attachment; filename="certificado-MiEncebollado.crt"';
        add_header Cache-Control "no-cache";
    }
    # IP y puerto con los que el servidor emitió su certificado (lo escribe el script).
    location = /instalar-config.json {
        alias /usr/share/nginx/certs/instalar-config.json;
        default_type application/json;
        add_header Cache-Control "no-cache";
    }

    # El "shell" de la PWA nunca se cachea en el navegador: si no, un
    # teléfono podría quedarse con una versión vieja tras actualizar. Los
    # archivos con hash en el nombre (/assets) sí se cachean para siempre.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /registerSW.js {
        add_header Cache-Control "no-cache";
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Rutas de la SPA (/mesero, /caja, /cocina...): siempre index.html.
    location / {
        try_files $uri /index.html;
    }
}
